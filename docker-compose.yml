services:
  nutriai:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./chroma_db:/app/chroma_db
      - ./documents:/app/documents
      - ./.env:/app/.env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
